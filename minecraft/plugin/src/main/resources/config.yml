# Money is in-game dollars only. It never turns back into items except by buying from a shop.

# Given once, the first time someone joins.
starting-balance: 100.00

# Server shop (/shop, /sell). Prices live in shop.yml.
# Buying from the server costs this many times what selling pays. Keeps people from flipping.
buy-multiplier: 3.0
# Selling lowers an item's price for everyone; it recovers over time.
# After this many dollars' worth of one item is sold, its price is cut in half...
saturation-dollars: 2000
# ...and that pressure halves every this many hours.
recovery-half-life-hours: 24

# Percent taken on every stock buy and sell. Stops spam-flipping.
trade-fee-percent: 1.0

# Percent taken from the seller on every player /market sale.
market-fee-percent: 2.0

# Shown in the /stock menu, in this order: ticker and the item it's drawn as. Up to 21.
popular-stocks:
  SPY: BEACON
  QQQ: NETHER_STAR
  AAPL: APPLE
  MSFT: GLASS_PANE
  NVDA: EMERALD
  GOOGL: COMPASS
  AMZN: CHEST
  META: ENDER_EYE
  TSLA: LIGHTNING_ROD
  NFLX: PAINTING
  AMD: REDSTONE
  PLTR: SPYGLASS
  JPM: GOLD_INGOT
  V: MAP
  COST: BARREL
  KO: HONEY_BOTTLE
  MCD: BREAD
  SBUX: COCOA_BEANS
  NKE: LEATHER_BOOTS
  DIS: FIREWORK_ROCKET
  UBER: MINECART

# Only allow stock trades while the real market is open (NYSE/Nasdaq hours).
market-hours-only: false

# How long a price is reused before asking Yahoo again.
quote-cache-seconds: 60

# Which kinds of tickers can be traded.
allowed-types: [EQUITY, ETF]

# No penny stocks.
min-price: 5.00

# Leveraged / volatility products that would make people rich (or broke) too fast.
blocked-symbols:
  - TQQQ
  - SQQQ
  - SOXL
  - SOXS
  - UPRO
  - SPXU
  - SPXL
  - SPXS
  - TNA
  - TZA
  - LABU
  - LABD
  - UVXY
  - SVXY
  - VXX
  - NVDL
  - TSLL
  - MSTU
  - MSTX
  - CONL

max-listings-per-player: 27

# A tip in chat every this many minutes, going through the list in order. 0 turns them off.
tip-interval-minutes: 15
tips:
  - "Use <white>/shop</white> to buy and sell items with the server."
  - "Use <white>/sell all</white> to sell your whole inventory. Click things to keep them first."
  - "Use <white>/market</white> to buy and sell items with other players."
  - "Use <white>/stock</white> to invest your money in real stocks."
  - "Use <white>/pay</white> to send money to a friend."
  - "See who's richest with <white>/baltop</white>."
