# Server shop. `worth` is what the server pays for ONE item when nobody has sold it recently.
# Buying from the server costs worth × buy-multiplier (config.yml). `buy: false` = sell-only,
# `sell: false` (per item, or for a whole category) = buy-only.
#
# Storage blocks (iron block, hay bale, slime block...) are handled automatically as 9× (or 4×)
# the base item, and share its price drop. Don't list them here.
#
# Rough anchor: an hour of strip mining ≈ $1,000. AAPL is ~$340.

